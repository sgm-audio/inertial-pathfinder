version: '3.9'

# Production configuration for Sonic Mind Forge
# Usage: docker compose -f docker-compose.prod.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonic-mind-forge-prod
    expose:
      - "8080"
    environment:
      APP_ENV: production
      DEBUG: "false"
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      PORT: 8080
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-sonic-mind-forge-uploads}
      GCS_REPORTS_BUCKET: ${GCS_REPORTS_BUCKET:-sonic-mind-forge-reports}
      TARGET_LUFS_MIN: ${TARGET_LUFS_MIN:--14.0}
      TARGET_LUFS_MAX: ${TARGET_LUFS_MAX:--9.0}
      TARGET_PHASE_CORRELATION_MIN: ${TARGET_PHASE_CORRELATION_MIN:-0.5}
      API_KEY: ${API_KEY}
    env_file: .env.prod
    volumes:
      # Production: only uploads/reports, NO source code mounts
      - uploads:/app/uploads
      - reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    networks:
      - sonic-network
    # Security: read-only filesystem where possible
    read_only: false
    # Limit resources in production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    labels:
      com.example.description: "Sonic Mind Forge - Production Instance"
      com.example.environment: "production"

  # Optional: reverse proxy with nginx
  # nginx:
  #   image: nginx:alpine
  #   container_name: sonic-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - app
  #   networks:
  #     - sonic-network
  #   restart: always

volumes:
  uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_PATH:-./volumes}/uploads
  reports:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${VOLUMES_PATH:-./volumes}/reports

networks:
  sonic-network:
    driver: bridge
